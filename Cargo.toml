[package]
name = "omarss-engine"
version = "1.3.0"
edition = "2021"
authors = ["Ozan Özdil <ozan@pm.me>"]
description = "Lightweight, native RSS/Atom feed reader engine for Omarchy Linux"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
